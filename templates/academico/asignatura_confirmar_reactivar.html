{% extends "base.html" %}

{% block titulo %}Reactivar asignatura — Convoca{% endblock %}

{% block content %}
  <header>
    <h1>Reactivar asignatura</h1>
  </header>

  <p>¿Deseas reactivar la asignatura <strong>{{ object.nombre }}</strong>? Volverá a estar disponible para nuevas propuestas.</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="boton boton--primario">Reactivar</button>
    <a href="{% url 'academico:asignatura_lista' %}" class="boton boton--secundario">Cancelar</a>
  </form>
{% endblock %}
